[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-websearch"
version = "0.1.0"
description = "Configuration-driven multi-source deep web research for MCP and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=1.12,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "beautifulsoup4>=4.13,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
deep-websearch = "deep_websearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
