# 复制为 config.yaml；支持 DEEP_WEBSEARCH_CONFIG 指定其他绝对路径。
# auto = 配置齐全时启用；true = 请求启用，仍需通过可用性检查；false = 始终跳过。
sources:
  youtube: {enabled: auto, options: {}}
  reddit: {enabled: auto, options: {}}
  x: {enabled: auto, options: {}}
  bilibili: {enabled: auto, options: {}}
  douyin:
    enabled: auto
    options:
      # 只有账号已获 aweme.dy.video_search 权限时才设为 true。
      search_permission: false
      # device_id 可在 .env 的 DOUYIN_DEVICE_ID 中填写，勿把设备标识提交到仓库。
  brave: {enabled: auto, options: {}}
  searxng: {enabled: auto, options: {}}
  exa: {enabled: auto, options: {}}
  tavily: {enabled: auto, options: {}}
  serper: {enabled: auto, options: {}}
  serpapi: {enabled: auto, options: {}}

search:
  rounds: 2
  max_queries: 48
  max_requests: 200
  max_results: 200
  per_query_limit: 10
  concurrency: 4
  timeout_seconds: 20
  retries: 1

notifications:
  # Windows 交互式桌面自动启用；一次 broad_search 最多提醒一次，不阻塞搜索。
  # false 可关闭弹窗；MCP/JSON 的 missing_sources 和 coverage 仍然保留。
  desktop: auto
